pull_request_rules:
  - name: vm5 direct-merge barrier invariant
    conditions:
      - -mergify-configuration-changed
      - title ~= ^VM5_DM_QUEUE_
    actions:
      queue:

merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    files:
      critical:
        include:
          - critical/**/*
      ordinary:
        include:
          - ordinary/**/*
  barrier_files:
    include:
      - barrier/**/*

queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/ci-gate
    merge_method: merge
