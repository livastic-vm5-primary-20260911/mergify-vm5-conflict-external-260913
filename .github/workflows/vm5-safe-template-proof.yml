name: VM5 safe template proof
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Mergify-rendered title
        required: true
        type: string
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Record payload safely
        shell: python
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          import os, base64
          v = os.environ.get("PAYLOAD", "")
          print("PAYLOAD_B64=" + base64.b64encode(v.encode()).decode())
          print("PAYLOAD_LEN=" + str(len(v)))
