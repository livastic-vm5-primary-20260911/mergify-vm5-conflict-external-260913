queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - title ~= ^VM5_SKIP_ALLOW_
      - check-success = vm5-green
    merge_method: merge
    batch_size: 1
    max_checks_retries: 0

merge_queue:
  mode: serial
  max_parallel_checks: 2
  skip_intermediate_results: true

pull_request_rules:
  - name: VM5 request reviews positive control
    conditions:
      - title = VM5_REQUEST_REVIEWS_POSITIVE_20261004
      - check-success = vm5-request-reviews-gate
    actions:
      request_reviews:
        users:
          - livastic-vm5-primary-20260911
