pull_request_rules:
  - name: vm5 isolated required-status freshness
    conditions:
      - title = VM5_ISOLATED_STATUS_FRESHNESS
      - -mergify-configuration-changed
    actions:
      queue:

merge_queue:
  mode: isolated
  max_parallel_checks: 1

queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/ci-gate
    merge_method: merge
