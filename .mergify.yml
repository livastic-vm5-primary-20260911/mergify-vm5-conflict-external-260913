pull_request_rules:
  - name: vm5 failed-tests latest-run provenance batch
    conditions:
      - title ~= ^VM5_MQ_ARTIFACT_
      - -mergify-configuration-changed
    actions:
      queue:

  - name: VM5 current timer label-rename revocation discriminator
    conditions:
      - label = vm5-timer-current-approval-old
      - title = VM5_TIMER_LABEL_RENAME_CURRENT_20260925
      - current-datetime >= 2026-09-25T13:04:00Z
    actions:
      merge:
        method: squash

merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    files:
      ordinary:
        include:
          - ordinary/**/*

queue_rules:
  - name: default
    batch_size: 3
    batch_max_wait_time: 5 minutes
    batch_max_failure_resolution_attempts: 4
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/ci-gate
    merge_method: merge-batch
