pull_request_rules:
  - name: VM5 direct merge scope positive control 20260925
    conditions:
      - base = vm5-direct-scope-base-20260925
      - title ~= ^VM5_DIRECT_SCOPE_(BETA|ALPHA)_20260925$
    actions:
      queue:

merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    files:
      alpha:
        include:
          - vm5-direct-alpha/**/*
      beta:
        include:
          - vm5-direct-beta/**/*

queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions: []
    merge_method: merge
