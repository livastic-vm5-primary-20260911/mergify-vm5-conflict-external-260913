pull_request_rules:
  - name: VM5 create stable-env backport
    conditions:
      - label = vm5-backport-env2-go
    actions:
      backport:
        branches:
          - stable
  - name: VM5 auto-merge stable-env generated backport
    conditions:
      - author = mergify[bot]
      - head ~= ^mergify/bp/stable/pr-
      - check-success = trusted-ci
    actions:
      merge:
        method: merge
