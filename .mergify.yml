# post_check rule 'VM5 current post_check stale-head freshness 261004' was removed without replacement (no success_conditions or neutral_conditions to migrate)
queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - title ~= ^VM5_SKIP_ALLOW_
      - check-success = vm5-green
    merge_method: merge
    batch_size: 1
    max_checks_retries: 0

merge_queue:
  mode: serial
  max_parallel_checks: 2
  skip_intermediate_results: true
