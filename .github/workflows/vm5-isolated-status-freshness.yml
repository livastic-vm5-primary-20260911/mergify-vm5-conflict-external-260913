name: VM5 isolated status freshness

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  ci-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Log provenance
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
        run: |
          echo "head=$HEAD_REF title=$PR_TITLE attempt=$RUN_ATTEMPT sha=$SHA"
      - name: Hold synthetic isolated queue checks
        if: startsWith(github.head_ref, 'mergify/merge-queue/')
        run: sleep 45
      - name: Required-status freshness discriminator
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$HEAD_REF" = "vm5-isolated-status-src-260918" ] && echo "$PR_TITLE" | grep -q 'BLOCKED'; then
            echo 'VM5_SOURCE_SAME_SHA_REQUIRED_STATUS_INVALIDATED'
            exit 1
          fi
          echo 'VM5_REQUIRED_STATUS_PASS'
