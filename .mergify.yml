pull_request_rules:
  - name: VM5 create deterministic backport
    conditions:
      - label = vm5-backport-postcreate-go
    actions:
      backport:
        branches:
          - stable
  - name: VM5 docs-style auto-merge generated backport
    conditions:
      - author = mergify[bot]
      - head ~= ^mergify/bp/stable/pr-
      - check-success = trusted-ci
    actions:
      merge:
        method: merge
