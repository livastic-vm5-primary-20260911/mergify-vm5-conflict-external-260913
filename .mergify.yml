pull_request_rules:
  - name: vm5 failed-tests latest-run provenance batch
    conditions:
      - title ~= ^VM5_MQ_ARTIFACT_
      - -mergify-configuration-changed
    actions:
      queue:

merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    files:
      ordinary:
        include:
          - ordinary/**/*

queue_rules:
  - name: default
    batch_size: 3
    batch_max_wait_time: 1 second
    batch_max_failure_resolution_attempts: 4
    queue_conditions: []
    merge_conditions:
      - check-success = vm5-never-pass-20260925
    merge_method: merge-batch
